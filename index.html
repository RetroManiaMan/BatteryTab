<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BatteryTab</title>
<link id="favicon" rel="icon" type="image/png" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f1ff;--text:#1b1740;--muted:#6a6590;--card:rgba(255,255,255,.65);--line:rgba(60,40,160,.15);--track:rgba(60,40,160,.12);
  --c1:#00c98a;--c2:#00a8e8;--glow:.25;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0919;--text:#f4f1ff;--muted:#9d97c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--track:rgba(255,255,255,.1);--glow:.55}}
:root[data-theme="dark"]{--bg:#0b0919;--text:#f4f1ff;--muted:#9d97c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--track:rgba(255,255,255,.1);--glow:.55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;overflow-x:hidden;position:relative}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:var(--glow);transition:background 1s}
.aurora i:nth-child(1){background:var(--c1);top:-20vmax;left:-15vmax;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:var(--c2);bottom:-25vmax;right:-15vmax;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;width:min(420px,92vw);padding:20px 0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero{padding:26px 20px 22px;text-align:center}
h1{margin:0 0 4px;font-size:1.05rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.ringwrap{position:relative;width:min(280px,70vw);aspect-ratio:1;margin:10px auto 6px}
svg.ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .track{stroke:var(--track)}
.ring .bar{stroke:url(#g);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 10px var(--c1))}
.num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num b{font-size:clamp(3.6rem,19vw,5.2rem);line-height:1;font-weight:700;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.num b small{font-size:.4em;margin-left:2px}
.num span{margin-top:6px;font-size:.95rem;color:var(--muted)}
.bolt{display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.9)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{padding:16px 18px}
.stat p{margin:0;font-size:.8rem;color:var(--muted)}
.stat strong{display:block;margin-top:4px;font-size:1.25rem;font-weight:600}
.fav{padding:18px}
.fav h2{margin:0 0 12px;font-size:.95rem;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;font:inherit;font-size:.9rem;font-weight:600;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 12px;cursor:pointer;transition:background .2s,border-color .2s}
.chips button[aria-pressed="true"]{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;color:#07101a}
.chips button:focus-visible,input:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.prev{display:flex;align-items:flex-end;gap:16px;margin-top:16px;color:var(--muted);font-size:.8rem}
.prev div{display:flex;flex-direction:column;align-items:center;gap:6px}
.prev img{image-rendering:auto;border-radius:4px}
code{display:block;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--track);font:600 .85rem ui-monospace,SFMono-Regular,Menlo,monospace;user-select:all;overflow-x:auto}
.demo a{color:var(--c2)}
.note{font-size:.82rem;color:var(--muted);line-height:1.5;margin:0;text-align:center;padding:0 8px}
.demo{display:none;padding:16px 18px}
.demo.on{display:block}
.demo label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--c2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>
<main>
  <section class="card hero" aria-live="polite">
    <h1>BatteryTab</h1>
    <div class="ringwrap">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop id="s1" offset="0" stop-color="#00c98a"/><stop id="s2" offset="1" stop-color="#00a8e8"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="86"/>
        <circle class="bar" id="bar" cx="100" cy="100" r="86" stroke-dasharray="540.35" stroke-dashoffset="540.35"/>
      </svg>
      <div class="num"><b id="pct">--<small>%</small></b><span id="state">Reading battery…</span></div>
    </div>
  </section>

  <div class="stats">
    <div class="card stat"><p>Status</p><strong id="stat">—</strong></div>
    <div class="card stat"><p id="tlabel">Time left</p><strong id="time">—</strong></div>
  </div>

  <section class="card demo" id="demo">
    <label for="slider">No live battery source yet, so here's a preview. Drag to watch the tab icon change.</label>
    <input type="range" id="slider" min="1" max="100" value="64">
  </section>

  <section class="card demo" id="bridge">
    <label id="bridgeMsg"></label>
    <code>python3 batterytab-helper.py</code>
    <div class="chips" id="connectRow" style="margin-top:12px;display:none"><button id="connect">Connect to helper</button></div>
  </section>

  <section class="card fav">
    <h2>Tab icon style</h2>
    <div class="chips" role="group" aria-label="Tab icon style">
      <button data-style="ring" aria-pressed="true">Ring</button>
      <button data-style="cell" aria-pressed="false">Cell</button>
      <button data-style="bold" aria-pressed="false">Bold</button>
    </div>
    <div class="prev">
      <div><img id="p64" width="64" height="64" alt=""><span>Preview</span></div>
      <div><img id="p32" width="32" height="32" alt=""><span>Tab size</span></div>
      <div><img id="p16" width="16" height="16" alt=""><span>Small</span></div>
    </div>
  </section>

  <p class="note">Pin this tab and leave it open. The icon and tab title follow your battery live.</p>
  <p class="note" id="diag"></p>
</main>

<script>
const $ = id => document.getElementById(id);
let favicon = $('favicon');
const SWAP_LINK = /firefox/i.test(navigator.userAgent); // Firefox needs a fresh <link> to repaint
let iconKey = '';
const bar = $('bar');
const CIRC = 2 * Math.PI * 86;
const canvas = document.createElement('canvas');
canvas.width = canvas.height = 64;
const ctx = canvas.getContext('2d');
let style = 'ring', last = {level: null, charging: false};

try { style = localStorage.getItem('bt-style') || 'ring'; } catch (e) {}

function palette(p) {
  if (p <= 20) return ['#ff4d6d', '#ff2e93'];
  if (p <= 50) return ['#ffd447', '#ff8a3d'];
  return ['#3dffa8', '#00d1ff'];
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function bolt(cx, cy, s, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(cx + 0.15 * s, cy - 0.5 * s);
  ctx.lineTo(cx - 0.35 * s, cy + 0.08 * s);
  ctx.lineTo(cx - 0.02 * s, cy + 0.08 * s);
  ctx.lineTo(cx - 0.15 * s, cy + 0.5 * s);
  ctx.lineTo(cx + 0.35 * s, cy - 0.1 * s);
  ctx.lineTo(cx + 0.02 * s, cy - 0.1 * s);
  ctx.closePath();
  ctx.fill();
}

function label(p, color, size) {
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const s = String(p);
  const fs = s.length >= 3 ? size * 0.72 : size;
  ctx.font = `700 ${fs}px "Space Grotesk", system-ui, sans-serif`;
  ctx.fillText(s, 32, 34);
}

function drawFavicon(p, charging, force) {
  // Only redraw when the icon would actually look different.
  const key = style + '|' + p + '|' + charging;
  if (!force && key === iconKey) return;
  iconKey = key;
  const [a, b] = palette(p);
  ctx.clearRect(0, 0, 64, 64);
  const grad = ctx.createLinearGradient(0, 0, 64, 64);
  grad.addColorStop(0, a); grad.addColorStop(1, b);

  if (style === 'ring') {
    ctx.fillStyle = '#0d0b1f';
    rr(0, 0, 64, 64, 16); ctx.fill();
    ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(32, 32, 24, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.arc(32, 32, 24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(p, 2) / 100);
    ctx.stroke();
    if (charging) bolt(32, 32, 26, '#ffffff');
    else label(p === 100 ? 'F' : p, '#ffffff', 24);
  } else if (style === 'cell') {
    ctx.fillStyle = '#0d0b1f';
    rr(0, 0, 64, 64, 16); ctx.fill();
    ctx.save();
    rr(6, 6, 52, 52, 11); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    ctx.fillRect(6, 6, 52, 52);
    const h = 52 * p / 100;
    ctx.fillStyle = grad;
    ctx.fillRect(6, 58 - h, 52, h);
    ctx.restore();
    label(p, p > 45 ? '#0d0b1f' : '#ffffff', 26);
    if (charging) bolt(54, 10, 16, '#ffffff');
  } else {
    ctx.fillStyle = grad;
    rr(0, 0, 64, 64, 18); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    rr(4, 4, 56, 24, 14); ctx.fill();
    label(p, '#0d0b1f', 38);
    if (charging) bolt(54, 10, 16, '#0d0b1f');
  }
  const url = canvas.toDataURL('image/png');
  if (SWAP_LINK) {
    const next = document.createElement('link');
    next.id = 'favicon'; next.rel = 'icon'; next.type = 'image/png'; next.href = url;
    favicon.replaceWith(next);
    favicon = next;
  } else {
    favicon.href = url;
  }
  ['p64', 'p32', 'p16'].forEach(id => $(id).src = url);
}

function fmt(sec) {
  if (!isFinite(sec) || sec <= 0) return null;
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function render(level, charging, chargingTime, dischargingTime) {
  last = {level, charging};
  const [a, b] = palette(level);
  const root = document.documentElement.style;
  root.setProperty('--c1', a); root.setProperty('--c2', b);
  $('s1').setAttribute('stop-color', a); $('s2').setAttribute('stop-color', b);
  bar.style.strokeDashoffset = CIRC * (1 - level / 100);
  $('pct').innerHTML = `${level}<small>%</small>`;
  const full = level >= 100;
  $('state').innerHTML = charging ? '<span class="bolt">⚡</span> Charging' : (level <= 20 ? 'Running low' : 'On battery');
  $('stat').textContent = full && charging ? 'Fully charged' : (charging ? 'Plugged in' : 'Unplugged');
  $('tlabel').textContent = charging ? 'Until full' : 'Time left';
  $('time').textContent = fmt(charging ? chargingTime : dischargingTime) || (full && charging ? 'Done' : 'Estimating…');
  document.title = `${charging ? '⚡' : '🔋'} ${level}% · BatteryTab`;
  drawFavicon(level, charging);
}

document.querySelectorAll('.chips button').forEach(btn => {
  btn.setAttribute('aria-pressed', btn.dataset.style === style);
  btn.addEventListener('click', () => {
    style = btn.dataset.style;
    try { localStorage.setItem('bt-style', style); } catch (e) {}
    document.querySelectorAll('.chips button').forEach(x => x.setAttribute('aria-pressed', x === btn));
    if (last.level !== null) drawFavicon(last.level, last.charging, true);
  });
});

let demoWired = false;
function startDemo() {
  $('demo').classList.add('on');
  if (demoWired) return;
  demoWired = true;
  const sl = $('slider');
  const go = () => { lastKey = ''; render(+sl.value, false, Infinity, 3 * 3600 + 20 * 60); };
  sl.addEventListener('input', go);
  if (last.level === null) go();
}

// ---- Live battery tracking ----
// Chrome's Battery API is tied to page visibility: while a tab is in the background the
// browser stops handing it new readings (no timer or worker can change that). Firefox and
// Safari have no battery API at all. So BatteryTab can also read from a tiny local helper
// (batterytab-helper.py) that asks the OS directly, which works in the background.
const hasNative = 'getBattery' in navigator;
const BRIDGE_URL = 'http://127.0.0.1:8765/battery';
let helperPref = false;
try { helperPref = localStorage.getItem('bt-helper') === '1'; } catch (e) {}
let batteryRef = null, tickerWorker = null, lastKey = '';
let lastTick = 0, lastChange = 0, pause = null, bridgeUp = false, mode = 'none', hiddenAt = 0;
const watched = new WeakSet();
const clock = t => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
const probeHelper = () => !hasNative || helperPref; // Chrome only probes once you opt in

function showSetup(chromeHint) {
  const link = '<a href="batterytab-helper.py" download>download the helper</a>';
  $('bridgeMsg').innerHTML = chromeHint
    ? `Chrome pauses battery updates while this tab is in the background or on another desktop, so BatteryTab refreshes itself when you come back. For tracking that keeps going while you're away, ${link} and run it in Terminal, then tap Connect.`
    : `Firefox and Safari don't let websites read your battery, so BatteryTab uses a tiny helper on your computer. Please ${link}, then run it in Terminal. This page connects on its own.`;
  $('connectRow').style.display = chromeHint ? '' : 'none';
  $('connect').textContent = 'Connect to helper';
  $('bridge').classList.add('on');
}

function updateDiag() {
  const label = mode === 'helper' ? 'Live via helper (works in the background)'
              : mode === 'native' ? 'Live while this tab is visible' : 'Preview';
  const parts = [label];
  if (lastTick) parts.push('checked ' + clock(lastTick));
  if (lastChange) parts.push('changed ' + clock(lastChange));
  if (pause) parts.push(`browser paused this tab for ${fmt(pause.ms / 1000)} (resumed ${clock(pause.at)})`);
  $('diag').textContent = parts.join(' · ');
}

function sync(bat) {
  const level = Math.round(bat.level * 100);
  const key = [level, bat.charging, bat.chargingTime, bat.dischargingTime].join('|');
  if (key === lastKey) return;
  lastKey = key;
  lastChange = Date.now();
  render(level, bat.charging, bat.chargingTime, bat.dischargingTime);
  updateDiag();
}

function watch(bat) {
  batteryRef = bat;
  if (!watched.has(bat)) {
    watched.add(bat);
    ['levelchange', 'chargingchange', 'chargingtimechange', 'dischargingtimechange']
      .forEach(e => bat.addEventListener(e, () => { if (!bridgeUp) sync(bat); }));
  }
  if (!bridgeUp) sync(bat);
}

async function poll() {
  try { watch(await navigator.getBattery()); } catch (e) {}
}

async function pollBridge() {
  try {
    const r = await fetch(BRIDGE_URL, {cache: 'no-store', signal: AbortSignal.timeout(4000)});
    if (!r.ok) throw new Error('no battery');
    const d = await r.json();
    if (!bridgeUp) {
      bridgeUp = true; mode = 'helper';
      $('bridge').classList.remove('on'); $('demo').classList.remove('on');
    }
    sync({level: d.level / 100, charging: !!d.charging,
          chargingTime: d.chargingTime ?? Infinity, dischargingTime: d.dischargingTime ?? Infinity});
  } catch (e) {
    const wasUp = bridgeUp;
    bridgeUp = false;
    if (!hasNative && (wasUp || mode === 'none')) { mode = 'preview'; showSetup(false); startDemo(); }
    else if (wasUp && hasNative) mode = 'native';
  }
}

async function refresh() {
  if (probeHelper()) await pollBridge();
  if (!bridgeUp && hasNative) await poll();
}

function tick() {
  const now = Date.now();
  if (lastTick && now - lastTick > (tickerWorker ? 30000 : 150000)) pause = {at: now, ms: now - lastTick};
  lastTick = now;
  refresh().finally(updateDiag);
}

function startTicker(fn, ms) {
  try {
    const src = `setInterval(() => postMessage(0), ${ms});`;
    tickerWorker = new Worker(URL.createObjectURL(new Blob([src], {type: 'text/javascript'})));
    tickerWorker.onmessage = fn;
  } catch (e) {
    setInterval(fn, ms); // fallback if workers are blocked
  }
}

// Self-heal for Chrome: after the tab was hidden (background tab, or another macOS desktop)
// its Battery API connection can stay dead until a reload. So when you come back, reload once.
function maybeRecover() {
  if (!hasNative || bridgeUp || !hiddenAt || Date.now() - hiddenAt < 15000) return;
  try {
    if (Date.now() - (+sessionStorage.getItem('bt-reload') || 0) < 20000) return;
    sessionStorage.setItem('bt-reload', Date.now());
    if (last.level !== null) sessionStorage.setItem('bt-prev', last.level);
  } catch (e) {}
  location.reload();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  maybeRecover();
  hiddenAt = 0;
  refresh().finally(updateDiag);
});
window.addEventListener('focus', () => { maybeRecover(); refresh().finally(updateDiag); });
window.addEventListener('pageshow', () => refresh().finally(updateDiag));

$('connect').addEventListener('click', async () => {
  helperPref = true;
  try { localStorage.setItem('bt-helper', '1'); } catch (e) {}
  await pollBridge();
  if (!bridgeUp) $('connect').textContent = "Couldn't find it. Start the helper, then tap again";
  updateDiag();
});

(async () => {
  startTicker(tick, 5000);
  setInterval(tick, 15000); // backup in case the worker ticker ever stalls
  if (navigator.locks) navigator.locks.request('batterytab-keepalive', () => new Promise(() => {})).catch(() => {});
  lastTick = Date.now();
  if (!hasNative) $('state').textContent = 'Looking for helper…';
  if (probeHelper()) await pollBridge();
  if (!bridgeUp && hasNative) {
    try {
      mode = 'native'; watch(await navigator.getBattery());
      const prev = sessionStorage.getItem('bt-prev'); sessionStorage.removeItem('bt-prev');
      if (prev !== null && last.level !== null && +prev !== last.level) showSetup(true);
    }
    catch (e) { mode = 'none'; startDemo(); }
  }
  updateDiag();
})();
</script>
</body>
</html>
